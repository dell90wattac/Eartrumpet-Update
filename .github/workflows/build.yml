name: Build EarTrumpet

# Personal build pipeline. Produces a loose, unpackaged, unsigned EarTrumpet.exe
# as a downloadable artifact -- no MSIX, no code signing, no Store plumbing.

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "Graphics/**"
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: x86

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GitVersionTask reads history and tags to stamp the assembly version.
          fetch-depth: 0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore EarTrumpet.vs15.sln

      - name: Clear Bugsnag API key placeholder
        shell: pwsh
        run: |
          # Upstream CI substitutes their own crash-reporting key here. A private
          # build has no key and should not report to anyone, so blank it out.
          (Get-Content EarTrumpet\App.config -Raw) -replace '\{bugsnag\.apikey\}', '' |
            Set-Content EarTrumpet\App.config -NoNewline

      - name: Locate Windows.winmd
        shell: pwsh
        run: |
          # The project hardcodes two Windows SDK paths, neither of which exists
          # on a hosted runner -- they ship newer kits only. Without this the
          # WinRT reference resolves to nothing and every `using Windows.*`
          # fails with CS0246. Pick the newest kit present and pass it through.
          $roots = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\UnionMetadata",
            "$env:ProgramFiles\Windows Kits\10\UnionMetadata"
          )
          $winmd = Get-ChildItem -Path $roots -Filter Windows.winmd -Recurse -ErrorAction SilentlyContinue |
            Sort-Object { try { [version]$_.Directory.Name } catch { [version]'0.0.0.0' } } -Descending |
            Select-Object -First 1

          if (-not $winmd) {
            Get-ChildItem -Path $roots -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Write-Host
            throw "No Windows.winmd found under any Windows Kits UnionMetadata directory."
          }

          Write-Host "Using $($winmd.FullName)"
          "WINDOWS_WINMD_PATH=$($winmd.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        shell: cmd
        run: >
          msbuild EarTrumpet\EarTrumpet.csproj
          /p:Platform=%BUILD_PLATFORM%
          /p:Configuration=%BUILD_CONFIGURATION%
          /p:WindowsWinmdPath="%WINDOWS_WINMD_PATH%"
          /p:OutputPath=%GITHUB_WORKSPACE%\artifacts\EarTrumpet\
          -maxcpucount

      - name: Upload EarTrumpet
        uses: actions/upload-artifact@v4
        with:
          name: EarTrumpet
          path: artifacts/EarTrumpet
          if-no-files-found: error
